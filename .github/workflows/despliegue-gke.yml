# Integracion y despliegue continuos de cliente-service hacia el clúster de GKE.
#
# El disparador es un push a main. Si las pruebas fallan, no se construye imagen;
# si la imagen no se publica, no se despliega. Cada etapa es una compuerta.
name: CI/CD a GKE

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

env:
  IMAGEN: alvarosalazar/cliente-service
  CLUSTER: fogata
  REGION: us-central1
  NAMESPACE: la-fogata-digital
  DESPLIEGUE: cliente-service
  CONTENEDOR: cliente-service

jobs:

  # ---------------------------------------------------------------- pruebas --
  pruebas:
    name: Pruebas
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Preparar JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Ejecutar las pruebas
        run: ./mvnw -B test

      - name: Guardar los informes de pruebas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: informes-pruebas
          path: target/surefire-reports/
          if-no-files-found: ignore

  # ----------------------------------------------------------------- imagen --
  imagen:
    name: Construir y publicar la imagen
    needs: pruebas
    # Una rama de trabajo se prueba, pero no publica imagen ni despliega.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      etiqueta: ${{ steps.etiqueta.outputs.valor }}
    steps:
      - uses: actions/checkout@v7

      - name: Calcular la etiqueta de la imagen
        id: etiqueta
        # La etiqueta es el identificador del commit, no "latest". Es lo que
        # permite saber que version corre en el cluster y lo que hace que el
        # despliegue sea un cambio real para Kubernetes.
        run: echo "valor=main-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Preparar Buildx
        uses: docker/setup-buildx-action@v4

      - name: Entrar a Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USUARIO }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Construir y publicar
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGEN }}:${{ steps.etiqueta.outputs.valor }}
            ${{ env.IMAGEN }}:main
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # -------------------------------------------------------------- desplegar --
  desplegar:
    name: Desplegar en GKE
    needs: imagen
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Sin este permiso no hay token de OIDC y la autenticacion con Google
      # falla. Es el permiso que mas veces falta.
      id-token: write
    steps:
      - name: Autenticarse en Google Cloud sin llaves
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_PROVEEDOR_WIF }}
          service_account: ${{ vars.GCP_CUENTA_DESPLIEGUE }}

      - name: Obtener credenciales del clúster
        uses: google-github-actions/get-gke-credentials@v3
        with:
          cluster_name: ${{ env.CLUSTER }}
          location: ${{ env.REGION }}

      - name: Cambiar la imagen del despliegue
        run: |
          kubectl -n "$NAMESPACE" set image \
            "deployment/$DESPLIEGUE" \
            "$CONTENEDOR=$IMAGEN:${{ needs.imagen.outputs.etiqueta }}"

      - name: Esperar a que el despliegue termine
        # Esta es la compuerta real: si los pods nuevos nunca pasan la sonda de
        # readiness, el comando agota el plazo y el trabajo falla.
        run: |
          kubectl -n "$NAMESPACE" rollout status \
            "deployment/$DESPLIEGUE" --timeout=300s

      - name: Deshacer si el despliegue no prosperó
        if: failure()
        run: |
          kubectl -n "$NAMESPACE" rollout undo "deployment/$DESPLIEGUE"
          kubectl -n "$NAMESPACE" rollout status \
            "deployment/$DESPLIEGUE" --timeout=300s

      - name: Dejar constancia de lo que quedó corriendo
        if: always()
        run: |
          kubectl -n "$NAMESPACE" get deployment "$DESPLIEGUE" \
            -o jsonpath='{.spec.template.spec.containers[0].image}{"\n"}'
          kubectl -n "$NAMESPACE" get pods -l app="$DESPLIEGUE"
