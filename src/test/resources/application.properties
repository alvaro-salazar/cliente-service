# Ojo: este archivo NO se suma al de src/main/resources, lo SUSTITUYE. El
# classpath de pruebas va primero, asi que todo lo que la aplicacion necesite
# para arrancar tiene que estar tambien aqui.
spring.application.name=cliente-service

# Sin esta linea el arranque falla con "Could not resolve placeholder
# 'api.version'", porque la ruta del controlador la lleva incrustada.
api.version=v1

# Tests: usar jwk-set-uri en lugar de issuer-uri para evitar llamada HTTP a Keycloak al arrancar
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:8090/realms/curso-springboot/protocol/openid-connect/certs
