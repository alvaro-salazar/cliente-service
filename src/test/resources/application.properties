# Propiedades custom requeridas por el controlador
api.version=v1
app.version=test

# Hibernación DDL — crea y destruye esquema en cada test suite
spring.jpa.hibernate.ddl-auto=create-drop

# Desactiva import.sql de Spring SQL init (Hibernate carga su propio import.sql)
spring.sql.init.mode=never
spring.jpa.defer-datasource-initialization=false
