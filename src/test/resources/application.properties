# Propiedades custom requeridas por el controlador
api.version=v1
app.version=test

# Hibernación DDL — crea y destruye esquema en cada test suite
spring.jpa.hibernate.ddl-auto=create-drop

# Desactiva import.sql de Spring SQL init (Hibernate carga su propio import.sql)
spring.sql.init.mode=never
spring.jpa.defer-datasource-initialization=false

# OAuth2: usar jwk-set-uri en lugar de issuer-uri para evitar llamada HTTP al
# arrancar el contexto de tests (Keycloak no está corriendo durante los tests).
# El JwtDecoder se mockea en cada clase de test que lo necesita.
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:8090/realms/curso-springboot/protocol/openid-connect/certs
